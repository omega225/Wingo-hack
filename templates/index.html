<!DOCTYPE html>
<html>
<head>
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body, html { margin: 0; padding: 0; height: 100%; overflow: hidden; background: #000; font-family: monospace; }
        
        /* The Game Website */
        .game-frame { width: 100%; height: 100%; border: none; z-index: 1; }

        /* The Cracking Overlay */
        .crack-panel {
            position: absolute;
            top: 20px;
            right: 10px;
            width: 160px;
            background: rgba(0, 0, 0, 0.85);
            border: 1px solid #00ff41;
            border-radius: 10px;
            padding: 10px;
            z-index: 100;
            box-shadow: 0 0 15px #00ff41;
            color: #00ff41;
            transition: all 0.3s;
        }

        .input-box {
            background: #000;
            border: 1px solid #00ff41;
            color: #fff;
            width: 100%;
            font-size: 10px;
            text-align: center;
            margin: 5px 0;
            padding: 4px;
        }

        .btn-crack {
            background: #00ff41;
            color: #000;
            width: 100%;
            font-weight: 900;
            font-size: 10px;
            padding: 8px;
            text-transform: uppercase;
            cursor: pointer;
        }

        .result-zone {
            margin-top: 10px;
            border-top: 1px dashed #00ff41;
            padding-top: 8px;
            text-align: center;
        }

        .blink { animation: blink 1s infinite; }
        @keyframes blink { 0% { opacity: 1; } 50% { opacity: 0.3; } 100% { opacity: 1; } }
    </style>
</head>
<body>

    <!-- LIVE GAME (Maanwin) -->
    <iframe src="https://maanwin.site/home/all/wingo" class="game-frame"></iframe>

    <!-- FLOATING CRACK PANEL -->
    <div class="crack-panel" id="panel">
        <div class="flex justify-between items-center text-[7px] mb-2">
            <span class="blink">● CORE_V18</span>
            <span>ADMIN MODE</span>
        </div>

        <div class="text-[8px] opacity-60 uppercase">Target Period:</div>
        <input type="number" id="period" class="input-box" placeholder="2024000...">
        
        <button onclick="crackServer()" class="btn-crack">CRACK NOW</button>

        <div id="result" class="hidden result-zone space-y-2">
            <div id="resColor" class="text-xl font-black italic">--</div>
            <div id="resSize" class="text-[10px] font-bold">--</div>
            <div id="hash" class="text-[5px] opacity-30 break-all">HASH: --</div>
            <div class="text-[7px] text-white bg-green-900 px-1 font-bold">100% ACCURATE</div>
        </div>
    </div>

    <script>
        async function crackServer() {
            const period = document.getElementById('period').value;
            if(!period) return;

            const btn = document.querySelector('.btn-crack');
            const resZone = document.getElementById('result');

            btn.innerText = "CRACKING...";
            resZone.classList.add('hidden');

            // Simulate server-side decryption
            setTimeout(async () => {
                const res = await fetch(`/crack?period=${period}`);
                const data = await res.json();

                btn.innerText = "CRACK NOW";
                resZone.classList.remove('hidden');

                const colorEl = document.getElementById('resColor');
                colorEl.innerText = data.color;
                colorEl.style.color = data.color === "GREEN" ? "#26a69a" : "#ef5350";
                
                document.getElementById('resSize').innerText = "RESULT: " + data.size;
                document.getElementById('hash').innerText = "KEY: " + data.hash_key;
            }, 800);
        }
        
        // Make panel draggable for mobile
        let panel = document.getElementById('panel');
        panel.ontouchmove = function(e) {
            let touch = e.touches[0];
            panel.style.left = touch.pageX - 80 + 'px';
            panel.style.top = touch.pageY - 50 + 'px';
        };
    </script>
</body>
</html>
